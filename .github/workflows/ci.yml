name: CI

# SCRUM-15 — repo + CI. Runs the machine-readable design-system gates on every
# push and PR to main: WCAG contrast on tokens + decorative-token lint + the
# frozen Penpot board pairs (SCRUM-93), and the responsive-foundation invariants
# (type scale, safe areas, touch targets).
# Both scripts report `skipped` — never a false green — for the build-stylesheet
# scan until the real app stylesheet exists.
# ⚠️ The Penpot part asserts `design-system/penpot-pairs.json`, a FROZEN snapshot
# of board colours — CI cannot reach Penpot. Refresh it with the sweep in
# `penpot-sweeps/penpot-contrast-sweep.js` after any design-file colour change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  design-system-checks:
    name: Design system checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install needed: these are dependency-free Node scripts.
      - name: Contrast check (WCAG tokens + decorative-token lint)
        run: node design-system/contrast-check.js

      - name: Responsive check (type scale · safe areas · touch targets)
        run: node design-system/responsive-check.js

      # The RN theme mirror must match the authoritative tokens.css — a mirror
      # without a guard is exactly the drift that bit this project once.
      - name: Token parity (src/theme/tokens.ts ↔ design-system/tokens.css)
        run: node src/theme/checks/parity.ts

      # THE ACCEPTANCE TEST: the four aim bands + the award maths + the wallet
      # invariant. Zero dependencies (Node 22 strips the types). This is the
      # gate the vertical slice is graded on — not fps (doc 17 §2 A5).
      - name: Domain checks (aim bands · award · wallet invariant · quotas)
        run: node src/domain/checks/run.ts

      # SCRUM-53 / PR-4. The three client rules of doc 19 §12/§12.5 were
      # DISCOVERED by the live project after being assumed, so they get a machine
      # check rather than a code comment: the capture id is minted before the
      # upload · a failed generation forces a NEW capture · 200 shrine_busy is a
      # queue, not an error. Fault-tested red on each rule.
      - name: Slice rules (capture id · failed-generation · shrine_busy queue)
        run: node src/domain/checks/slice.ts

      # THE SLICE'S ACCEPTANCE TEST (doc 17 §2 A5 — "the four aim bands grade
      # true, not fps"). Also guards the rethrow cap (SCRUM-23: a rethrow may
      # never be Bullseye) and proves the offset is a true Euclidean distance.
      - name: Throw grading (four aim bands · rethrow cap · geometry)
        run: node src/domain/checks/throw.ts

      # SCRUM-63 (ADR-008 D). Dependency-free, so it belongs here. It guards the
      # ad-category denylist's POLICY OF RECORD: the five classes and their legal
      # basis (alcohol is OUR policy, not the law's), the ritual-flow placement
      # rule, and the guard that our own ritual copy is never classified as a
      # blocked ad category.
      - name: Ad-denylist checks (ADR-008 D — categories · legal basis · placement)
        run: node src/domain/checks/ads.ts

      # SCRUM-53. Dependency-free, so it belongs here. It guards the two defects
      # found while continuing the slice: the capture id must survive EVERY route
      # hop (it was dropped on the way to /reward, so the last screen could never
      # show a receipt), and a non-2xx answer must never masquerade as a failed
      # generation (a 500, or an exhausted quota, was telling the player to
      # photograph a new offering when nothing had been spent).
      - name: Ritual wire (route contract · a refusal is not a failure)
        run: node src/lib/checks/ritual-wire.ts

      # SCRUM-80. Dependency-free, so it belongs here. Guards ADR-004's identity
      # bootstrap: a session with no user id is never reused, an unconfigured app
      # never calls a client, and an auth error always maps to a stable reason.
      - name: Session bootstrap (reuse · sign-in · unconfigured · error mapping)
        run: node src/lib/checks/session.ts

      # SCRUM-54b (PR-3). Both are dependency-free, so they belong here:
      #  · pathc-check   — ADR-002's LOCKED pipeline: the endpoints, the v3
      #    template clauses, and the ABSENCE of example colours in the identify
      #    prompt (the leak that mis-coloured five spike images)
      #  · sql-structure — the trap-#7 gate: a truncated migration cannot pass
      - name: Path C lock guard (ADR-002 — endpoints, template clauses, no colour leak)
        run: node supabase/checks/pathc-check.ts

      - name: Migration structure check (balanced $$, parens, closed statements)
        run: node supabase/checks/sql-structure.js

      # SCRUM-55. The decided-but-unrecorded drift this ticket fixed CAN recur by
      # hand — an index edited without its file, or a status claimed in the
      # register that the ADR itself contradicts. Dependency-free, so it belongs
      # in this job. It fails on any such disagreement.
      - name: ADR register integrity (index ↔ files, status agreement)
        run: node AppDesignConceptBoard/ADRs/check-adrs.js

  app-checks:
    name: App checks (typecheck · expo-doctor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # SCRUM-54b (PR-3) — the client libs' own harness. It imports i18n-js, so
      # it needs node_modules and therefore belongs in this job, not the
      # dependency-free one above.
      - name: Client-library checks (idempotency · invites · i18n · split storage · queue)
        run: npm run check:lib

      - name: Expo doctor
        run: npx expo-doctor
